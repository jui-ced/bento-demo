  let domain='',path='';
  try{const u=new URL(url.startsWith('http')?url:'https://'+url);domain=u.hostname.replace('www.','');path=u.pathname;}catch(e){domain=url;}
  return `URL을 분석해 JSON만 반환 (다른 텍스트 없이):
URL: ${url} / 도메인: ${domain} / 경로: ${path}

카테고리:
- 구매 고려용: 쇼핑몰·상품·의류·신발·뷰티·가전 구매 관련
- 콘텐츠 소비용: 유튜브·SNS·뉴스·맛집·여행·숙소·지도·영상 등 소비형 콘텐츠
- 지식·팁: 블로그·아티클·공부·개발·레시피·튜토리얼·위키 등 정보·학습
- 미분류: 위 셋 해당 없을 때만

신호가 하나라도 있으면 미분류 사용 금지.
{"category":"구매 고려용|콘텐츠 소비용|지식·팁|미분류","title":"한국어20자이내","summary":"2문장요약","emoji":"이모지1개"}`;
}

function txtPrompt(title,body) {
  return `텍스트 메모를 분석해 JSON만 반환:
제목: ${title||'없음'} / 내용: ${body}
카테고리: 구매 고려용(상품·가격·위시)|콘텐츠 소비용(일상·여행·맛집·콘텐츠)|지식·팁(공부·레시피·팁·정보)|미분류
{"category":"...","title":"한국어20자이내","summary":"1-2문장요약","emoji":"이모지1개"}`;
}

function imgPrompt() {
  return `이미지 분석해 JSON만 반환:
카테고리: 구매 고려용(상품·가격화면)|콘텐츠 소비용(SNS·맛집·여행·영상)|지식·팁(텍스트·코드·정보)|미분류
{"category":"...","title":"한국어20자이내","summary":"2문장요약","emoji":"이모지1개"}`;
}

function init() { render(); updateCounts(); }

function updateCounts() {
  ['콘텐츠 소비용','구매 고려용','지식·팁','미분류'].forEach(cat=>{
    const id={'콘텐츠 소비용':'c-consume','구매 고려용':'c-buy','지식·팁':'c-know','미분류':'c-none'}[cat];
    document.getElementById(id).textContent = items.filter(i=>i.category===cat).length;
  });
  document.getElementById('total').textContent = items.length;
  const n = items.filter(i=>i.category==='미분류').length;
  const b = document.getElementById('none-badge');
  if(n>0){b.style.display='inline';b.textContent=n;}else{b.style.display='none';}
}

function setSidebarActive(storeOrNull) {
  document.querySelectorAll('.nav-item,.cat-item').forEach(el=>el.classList.remove('active','active-cat'));
  if(!storeOrNull){document.getElementById('nav-home').classList.add('active');return;}
  const map={'콘텐츠 소비용':'si-consume','구매 고려용':'si-buy','지식·팁':'si-know','미분류':'si-none'};
  const el=document.getElementById(map[storeOrNull]);
  if(el) el.classList.add('active-cat');
}

function goHome() {
  view='home'; currentStore=null; currentFolder=null;
  setSidebarActive(null);
  document.getElementById('status-lbl').textContent='홈';
  render();
}

function goStore(store) {
  view='store'; currentStore=store; currentFolder=null;
  setSidebarActive(store);
  document.getElementById('status-lbl').textContent=store;
  render();
}

function goFolder(store, folderName) {
  view='folder'; currentStore=store; currentFolder=folderName;
  document.getElementById('status-lbl').textContent=`${store} › ${folderName}`;
  render();
}

function doSearch() { searchQ=document.getElementById('search-inp').value; render(); }

function render() {
  const c = document.getElementById('content');
  c.innerHTML = '';
  if (view==='home') renderHome(c);
  else if (view==='store') renderStore(c);
  else if (view==='folder') renderFolder(c);
}

function renderHome(c) {
  // 저장소 카드 3+1
  const stores = ['콘텐츠 소비용','구매 고려용','지식·팁','미분류'];
  const storeEmoji = {'콘텐츠 소비용':'📺','구매 고려용':'🛍️','지식·팁':'📚','미분류':'📦'};
  const grid = document.createElement('div');
  grid.className = 'home-grid';
  grid.style.gridTemplateColumns = '1fr 1fr';
  stores.forEach(s=>{
    const cnt = items.filter(i=>i.category===s).length;
    const card = document.createElement('div');
    card.className = 'store-card';
    const bc = CAT_BADGE[s];
    card.innerHTML=`<div class="store-card-icon">${storeEmoji[s]}</div><div class="store-card-name">${s}</div><div class="store-card-count">아이템 ${cnt}개</div>`;
    card.onclick=()=>goStore(s);
    grid.appendChild(card);
  });
  const lbl = document.createElement('div');
  lbl.className='recent-label';
  lbl.style.marginTop='16px';
  lbl.textContent='최근 저장';
  c.appendChild(grid);
  c.appendChild(lbl);
  let recent = [...items].reverse().slice(0,4);
  if(searchQ) recent=recent.filter(i=>i.title.toLowerCase().includes(searchQ.toLowerCase()));
  if(recent.length) recent.forEach(item=>c.appendChild(makeItemCard(item)));
  else c.appendChild(makeEmpty('아직 저장된 항목이 없어요'));
}

function renderStore(c) {
  // 브레드크럼
  const bc = document.createElement('div');
  bc.className='breadcrumb';
  bc.style.marginBottom='12px';
  bc.innerHTML=`<span class="link" onclick="goHome()">홈</span><i class="ti ti-chevron-right" style="font-size:12px" aria-hidden="true"></i><span class="cur">${currentStore}</span>`;
  c.appendChild(bc);

  // 이 저장소의 폴더들
  const storeFolders = folders.filter(f=>f.store===currentStore);
  if(storeFolders.length || true) {
    const flbl = document.createElement('div');
    flbl.className='items-label';
    flbl.innerHTML=`<span>폴더 (2레이어)</span>`;
    c.appendChild(flbl);
    const fg = document.createElement('div');
    fg.className='folder-grid';
    storeFolders.forEach(f=>{
      const cnt=items.filter(i=>i.category===currentStore&&i.folder===f.name).length;
      const fc=document.createElement('div');
      fc.className='folder-card';
      fc.innerHTML=`<i class="ti ti-folder" aria-hidden="true"></i><div class="folder-card-info"><div class="name">${f.name}</div><div class="cnt">아이템 ${cnt}개</div></div>`;
      fc.onclick=()=>goFolder(currentStore,f.name);
      fg.appendChild(fc);
    });
    // 새 폴더 버튼
    const nf=document.createElement('div');
    nf.className='folder-card folder-new';
    nf.innerHTML=`<i class="ti ti-plus" aria-hidden="true"></i><span>새 폴더</span>`;
    nf.onclick=()=>createFolder();
    fg.appendChild(nf);
    c.appendChild(fg);
  }

  // 폴더 미배정 아이템들
  let storeItems = items.filter(i=>i.category===currentStore&&!i.folder);
  if(searchQ) storeItems=storeItems.filter(i=>i.title.toLowerCase().includes(searchQ.toLowerCase())||(i.summary||'').toLowerCase().includes(searchQ.toLowerCase()));
  const ilbl=document.createElement('div');
  ilbl.className='items-label';
  ilbl.innerHTML=`<span>전체 항목 (폴더 미배정)</span><span style="font-size:11px;color:var(--color-text-tertiary);">${storeItems.length}개</span>`;
  c.appendChild(ilbl);
  if(storeItems.length) storeItems.slice().reverse().forEach(item=>c.appendChild(makeItemCard(item)));
  else c.appendChild(makeEmpty('이 저장소에 폴더 미배정 항목이 없어요'));
}

function renderFolder(c) {
  const bc=document.createElement('div');
  bc.className='breadcrumb';
  bc.style.marginBottom='12px';
  bc.innerHTML=`<span class="link" onclick="goHome()">홈</span><i class="ti ti-chevron-right" style="font-size:12px" aria-hidden="true"></i><span class="link" onclick="goStore('${currentStore}')">${currentStore}</span><i class="ti ti-chevron-right" style="font-size:12px" aria-hidden="true"></i><span class="cur">${currentFolder}</span>`;
  c.appendChild(bc);

  let folderItems = items.filter(i=>i.category===currentStore&&i.folder===currentFolder);
  if(searchQ) folderItems=folderItems.filter(i=>i.title.toLowerCase().includes(searchQ.toLowerCase()));
  const ilbl=document.createElement('div');
  ilbl.className='items-label';
  ilbl.innerHTML=`<span>${currentFolder}</span><span style="font-size:11px;color:var(--color-text-tertiary);">${folderItems.length}개</span>`;
  c.appendChild(ilbl);
  if(folderItems.length) folderItems.slice().reverse().forEach(item=>c.appendChild(makeItemCard(item)));
  else c.appendChild(makeEmpty('이 폴더에 아이템이 없어요'));
}

function makeItemCard(item) {
  const el=document.createElement('div');
  el.className='item-card';
  const bc=CAT_BADGE[item.category]||'badge-none';
  const tc={'url':'링크','img':'이미지','txt':'메모'}[item.type]||item.type;
  el.innerHTML=`
    <div class="item-thumb">${item.thumb?`<img src="${item.thumb}" alt="">`:(item.emoji||'📄')}</div>
    <div class="item-info">
      <div class="item-title">${item.title}</div>
      <div class="item-meta">
        <span class="badge ${bc}">${item.category}</span>
        <span class="ai-tag">AI 분류</span>
        <span class="type-tag">${tc}</span>
        <span>${item.time}</span>
        <button class="edit-btn" onclick="openEdit(${item.id})">수정</button>
      </div>
      <div class="item-summary">${item.summary||''}</div>
    </div>`;
  return el;
}

function makeEmpty(msg) {
  const el=document.createElement('div');
  el.className='empty-state';
  el.innerHTML=`<i class="ti ti-inbox" aria-hidden="true"></i><p>${msg}</p>`;
  return el;
}

function createFolder() {
  const name=prompt('폴더 이름을 입력하세요:');
  if(!name||!name.trim()) return;
  folders.push({id:'f'+Date.now(),store:currentStore,name:name.trim()});
  render();
}

/* ── 저장 모달 ── */
function openModal() {
  pending=null;
  ['url-inp','txt-title','txt-body'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  ['url-result','img-result','txt-result'].forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML='';});
  document.getElementById('img-prev').style.display='none';
  document.getElementById('btn-save').disabled=true;
  document.getElementById('modal').style.display='flex';
  switchTab('url');
}
function closeModal(){document.getElementById('modal').style.display='none';pending=null;}

function switchTab(t) {
  mTab=t;
  ['url','img','txt'].forEach(s=>{
    document.getElementById(`p-${s}`).style.display=s===t?'block':'none';
    document.getElementById(`mt-${s}`).className='m-tab'+(s===t?' active':'');
  });
  document.getElementById('btn-save').disabled=true; pending=null;
}

function showLoading(boxId,msg){document.getElementById(boxId).innerHTML=`<div class="classify-box"><div class="classify-lbl"><div class="dots"><span></span><span></span><span></span></div> ${msg}</div></div>`;}

function showResult(boxId,result){
  const cl=CAT_CLS[result.category]||'none-c';
  const btns=CATS.map(c=>`<button class="cat-btn ${CAT_CLS[c]}${c===result.category?' sel':''}" onclick="pickPending('${c}','${boxId}')">${c}</button>`).join('');
  document.getElementById(boxId).innerHTML=`
    <div class="classify-box">
      <div class="classify-lbl"><i class="ti ti-sparkles" style="font-size:12px" aria-hidden="true"></i> AI 자동 분류 완료 — 수정 가능</div>
      <div style="display:flex;align-items:center;gap:7px;margin-top:5px;">
        <span class="badge ${CAT_BADGE[result.category]||'badge-none'}">${result.category}</span>
        <span style="font-size:13px;font-weight:500;color:var(--color-text-primary);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${result.title}</span>
      </div>
      <div style="font-size:12px;color:var(--color-text-secondary);margin-top:4px;line-height:1.4;">${result.summary}</div>
      <div style="margin-top:8px;"><div style="font-size:11px;color:var(--color-text-tertiary);margin-bottom:4px;">저장소 변경</div><div class="cat-picker">${btns}</div></div>
    </div>`;
}

function pickPending(cat,boxId){if(!pending)return;pending.category=cat;showResult(boxId,pending);}

function onUrl(){clearTimeout(urlTimer);const v=document.getElementById('url-inp').value.trim();if(!v){document.getElementById('url-result').innerHTML='';document.getElementById('btn-save').disabled=true;pending=null;return;}urlTimer=setTimeout(()=>classifyUrl(v),500);}

async function classifyUrl(url){
  showLoading('url-result','AI 분류 중...');document.getElementById('btn-save').disabled=true;pending=null;
  const guess=guessDomain(url);
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:300,messages:[{role:'user',content:catPrompt(url)}]})});
    const d=await r.json();
    const txt=d.content.filter(b=>b.type==='text').map(b=>b.text).join('');
    const res=JSON.parse(txt.replace(/```json|```/g,'').trim());
    if(!CATS.includes(res.category)&&guess)res.category=guess;
    res.url=url;pending=res;showResult('url-result',res);document.getElementById('btn-save').disabled=false;
  }catch(e){
    let domain='';try{domain=new URL(url.startsWith('http')?url:'https://'+url).hostname.replace('www.','');}catch(e2){domain=url;}
    const cat=guess||'미분류';
    const fb={category:cat,emoji:'🔗',title:domain,summary:`${domain} 페이지`,url};
    pending=fb;showResult('url-result',fb);document.getElementById('btn-save').disabled=false;
  }
}

function onFile(e){const f=e.target.files[0];if(f)processImg(f);}
function onDrop(e){e.preventDefault();const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))processImg(f);}
function processImg(file){const r=new FileReader();r.onload=ev=>{const src=ev.target.result;document.getElementById('img-prev').src=src;document.getElementById('img-prev').style.display='block';classifyImg(src,file.name);};r.readAsDataURL(file);}

async function classifyImg(dataUrl,fname){
  showLoading('img-result','이미지 분석 중...');document.getElementById('btn-save').disabled=true;pending=null;
  const b64=dataUrl.split(',')[1],mt=dataUrl.split(';')[0].split(':')[1];
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:300,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:mt,data:b64}},{type:'text',text:imgPrompt()}]}]})});
    const d=await r.json();const txt=d.content.filter(b=>b.type==='text').map(b=>b.text).join('');
    const res=JSON.parse(txt.replace(/```json|```/g,'').trim());
    res.thumb=dataUrl;pending=res;showResult('img-result',res);document.getElementById('btn-save').disabled=false;
  }catch(e){
    const fb={category:'미분류',emoji:'🖼️',title:fname||'이미지',summary:'저장된 이미지',thumb:dataUrl};
    pending=fb;showResult('img-result',fb);document.getElementById('btn-save').disabled=false;
  }
}

function onTxt(){clearTimeout(urlTimer);const b=document.getElementById('txt-body').value.trim();if(!b){document.getElementById('txt-result').innerHTML='';document.getElementById('btn-save').disabled=true;pending=null;return;}urlTimer=setTimeout(()=>classifyTxt(),600);}

async function classifyTxt(){
  const title=document.getElementById('txt-title').value.trim(),body=document.getElementById('txt-body').value.trim();
  showLoading('txt-result','AI 분류 중...');document.getElementById('btn-save').disabled=true;pending=null;
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:300,messages:[{role:'user',content:txtPrompt(title,body)}]})});
    const d=await r.json();const txt=d.content.filter(b=>b.type==='text').map(b=>b.text).join('');
    const res=JSON.parse(txt.replace(/```json|```/g,'').trim());
    pending=res;showResult('txt-result',res);document.getElementById('btn-save').disabled=false;
  }catch(e){
    const fb={category:'지식·팁',emoji:'📝',title:document.getElementById('txt-title').value||body.substring(0,20),summary:body.substring(0,60)};
    pending=fb;showResult('txt-result',fb);document.getElementById('btn-save').disabled=false;
  }
}

function saveItem(){
  if(!pending)return;
  // 현재 폴더 보고 있으면 그 폴더에 자동 배정
  const folder = (view==='folder'&&currentFolder&&currentStore===pending.category)?currentFolder:null;
  items.push({id:Date.now(),type:mTab,title:pending.title,url:pending.url||'',category:pending.category,summary:pending.summary,thumb:pending.thumb||null,emoji:pending.emoji||'📄',time:'방금 전',folder});
  updateCounts();render();closeModal();
}

/* ── 수정 모달 ── */
function openEdit(id){
  const item=items.find(i=>i.id===id);if(!item)return;
  editId=id;editCat=item.category;
  document.getElementById('edit-title-lbl').textContent=item.title;
  document.querySelectorAll('#edit-picker .cat-btn').forEach(b=>b.classList.remove('sel'));
  document.querySelector(`#edit-picker .cat-btn[onclick="pickCat('${item.category}')"]`)?.classList.add('sel');
  document.getElementById('edit-modal').style.display='flex';
}
function closeEdit(){document.getElementById('edit-modal').style.display='none';editId=null;editCat=null;}
function pickCat(cat){editCat=cat;document.querySelectorAll('#edit-picker .cat-btn').forEach(b=>b.classList.remove('sel'));document.querySelector(`#edit-picker .cat-btn[onclick="pickCat('${cat}')"]`)?.classList.add('sel');}
function confirmEdit(){if(!editId||!editCat)return;const item=items.find(i=>i.id===editId);if(item)item.category=editCat;updateCounts();render();closeEdit();}

init();
</script>
