<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bento — AI 통합 아카이빙</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root {
  --bg: #f7f7f5;
  --bg2: #efefec;
  --border: #e0dfd9;
  --border2: #d0cfc9;
  --text: #1a1a18;
  --text2: #5a5a55;
  --text3: #9a9a94;
  --teal: #1D9E75;
  --teal-dark: #0F6E56;
  --teal-light: #E1F5EE;
  --radius: 10px;
  --radius-sm: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

/* ── Layout ── */
.layout { display: flex; flex: 1; overflow: hidden; }
.sidebar { width: 210px; border-right: 1px solid var(--border); background: var(--bg2); display: flex; flex-direction: column; flex-shrink: 0; padding: 16px 0; }
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* ── Sidebar ── */
.logo { display: flex; align-items: center; gap: 8px; padding: 0 16px 14px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.logo-box { width: 26px; height: 26px; background: var(--teal); border-radius: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 4px; }
.logo-box span { background: #fff; border-radius: 2px; }
.logo-box span:last-child { background: rgba(255,255,255,0.45); }
.logo-text { font-size: 15px; font-weight: 600; color: var(--text); }
.nav { display: flex; align-items: center; gap: 8px; padding: 7px 16px; font-size: 13px; color: var(--text2); cursor: pointer; border-radius: 0; }
.nav:hover { background: var(--bg); }
.nav.active { color: var(--teal-dark); font-weight: 500; background: var(--teal-light); }
.nav i { font-size: 15px; }
.sec-label { padding: 14px 16px 4px; font-size: 11px; color: var(--text3); letter-spacing: 0.05em; text-transform: uppercase; }
.cat-nav { display: flex; align-items: center; gap: 7px; padding: 5px 16px; font-size: 12px; color: var(--text2); cursor: pointer; }
.cat-nav:hover { color: var(--text); }
.cat-nav.active-cat { color: var(--teal-dark); font-weight: 500; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.cnt { margin-left: auto; font-size: 11px; color: var(--text3); }
.none-badge { background: #E24B4A; color: #fff; font-size: 10px; padding: 0 4px; border-radius: 99px; }
.sidebar-footer { margin-top: auto; padding: 12px 16px; }
.sidebar-footer .lbl { font-size: 11px; color: var(--text3); }
.sidebar-footer .num { font-size: 20px; font-weight: 600; color: var(--text); }

/* ── Topbar ── */
.topbar { padding: 11px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; background: var(--bg); }
.search-wrap { flex: 1; position: relative; display: flex; align-items: center; }
.search-wrap .si { position: absolute; left: 10px; font-size: 15px; color: var(--text3); pointer-events: none; line-height: 1; }
.search-wrap input { width: 100%; padding: 7px 12px 7px 34px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; background: var(--bg2); color: var(--text); outline: none; }
.search-wrap input:focus { border-color: var(--teal); }
.btn-add { display: flex; align-items: center; gap: 5px; padding: 7px 13px; background: var(--teal); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn-add:hover { background: var(--teal-dark); }

/* ── Content ── */
.content { flex: 1; overflow-y: auto; padding: 16px; }
.breadcrumb { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text3); margin-bottom: 14px; }
.breadcrumb .link { cursor: pointer; }
.breadcrumb .link:hover { color: var(--teal); }
.breadcrumb .cur { color: var(--text); font-weight: 500; }
.breadcrumb i { font-size: 12px; }

/* ── Home cards ── */
.store-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.store-card { border: 1px solid #e0dfd9; border-radius: var(--radius); padding: 16px; cursor: pointer; background: #fff; transition: border-color .15s, box-shadow .15s; }
.store-card:hover { border-color: #1D9E75; box-shadow: 0 2px 8px rgba(29,158,117,.1); }
.store-card-icon { font-size: 26px; margin-bottom: 8px; }
.store-card-name { font-size: 13px; font-weight: 500; margin-bottom: 3px; }
.store-card-cnt { font-size: 11px; color: var(--text3); }

/* ── Folder grid ── */
.section-label { font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
.folder-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 16px; }
.folder-card { border: 1px solid #e0dfd9; border-radius: var(--radius-sm); padding: 11px 13px; cursor: pointer; background: #fff; display: flex; align-items: center; gap: 9px; transition: border-color .15s; }
.folder-card:hover { border-color: #1D9E75; }
.folder-card i { font-size: 17px; color: var(--teal); }
.folder-name { font-size: 13px; font-weight: 500; }
.folder-cnt { font-size: 11px; color: var(--text3); margin-top: 1px; }
.folder-new { border: 1.5px dashed var(--border2); display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--text3); background: var(--bg2); }
.folder-new:hover { border-color: var(--teal); color: var(--teal); background: var(--teal-light); }

/* ── Item card ── */
.item-card { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid #e0dfd9; border-radius: var(--radius-sm); background: #fff; margin-bottom: 7px; transition: border-color .15s; }
.item-card:hover { border-color: #d0cfc9; }
.thumb { width: 40px; height: 40px; border-radius: var(--radius-sm); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; overflow: hidden; background: var(--bg2); }
.thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-sm); }
.item-info { flex: 1; min-width: 0; }
.item-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-meta { font-size: 11px; color: var(--text3); margin-top: 2px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.item-summary { font-size: 12px; color: var(--text2); margin-top: 3px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; }
.b-shop { background: #E1F5EE; color: #0F6E56; }
.b-life { background: #E6F1FB; color: #185FA5; }
.b-know { background: #FAEEDA; color: #854F0B; }
.b-none { background: var(--bg2); color: var(--text2); border: 1px solid var(--border); }
.ai-tag { font-size: 10px; color: var(--teal); background: var(--teal-light); padding: 1px 5px; border-radius: 4px; }
.type-tag { font-size: 10px; color: var(--text3); background: var(--bg2); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border); }
.edit-btn { font-size: 11px; color: var(--text3); background: none; border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; cursor: pointer; margin-left: auto; flex-shrink: 0; }
.edit-btn:hover { color: var(--teal); border-color: var(--teal); }

/* ── Empty ── */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px; color: var(--text3); text-align: center; gap: 8px; }
.empty i { font-size: 32px; opacity: 0.35; }
.empty p { font-size: 13px; line-height: 1.5; }

/* ── Status bar ── */
.statusbar { padding: 7px 16px; border-top: 1px solid var(--border); background: var(--bg2); display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--text3); }
.status-dot { width: 6px; height: 6px; background: var(--teal); border-radius: 50%; }

/* ── Modal ── */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { width: 440px; max-height: 92vh; overflow-y: auto; background: #fff; border-radius: var(--radius); border: 1px solid var(--border2); padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,.12); }
.modal-title { font-size: 14px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 7px; }
.modal-title i { color: var(--teal); }
.m-tabs { display: flex; gap: 5px; margin-bottom: 14px; }
.m-tab { flex: 1; padding: 7px; font-size: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg2); color: var(--text2); cursor: pointer; text-align: center; display: flex; align-items: center; justify-content: center; gap: 4px; transition: background .1s; }
.m-tab.active { background: var(--teal); color: #fff; border-color: var(--teal); }
.inp-label { font-size: 11px; color: var(--text2); margin-bottom: 4px; }
.inp { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; background: var(--bg2); color: var(--text); outline: none; font-family: inherit; }
.inp:focus { border-color: var(--teal); background: #fff; }
textarea.inp { resize: vertical; min-height: 75px; }
.drop-zone { border: 1.5px dashed var(--border2); border-radius: var(--radius-sm); padding: 22px; text-align: center; cursor: pointer; background: var(--bg2); transition: border-color .15s; }
.drop-zone:hover { border-color: var(--teal); background: var(--teal-light); }
.drop-zone .dz-icon { font-size: 28px; color: var(--teal); display: block; margin-bottom: 6px; }
.drop-zone p { font-size: 12px; color: var(--text2); line-height: 1.5; }
.img-prev { width: 100%; max-height: 110px; object-fit: contain; border-radius: var(--radius-sm); border: 1px solid var(--border); margin-top: 8px; }
.classify-box { margin-top: 10px; padding: 11px 13px; border-radius: var(--radius-sm); background: var(--teal-light); border: 1px solid #9FE1CB; }
.classify-lbl { font-size: 11px; color: var(--teal-dark); margin-bottom: 5px; display: flex; align-items: center; gap: 4px; }
.cat-picker { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
.cat-btn { padding: 3px 10px; border-radius: 99px; font-size: 11px; font-weight: 500; cursor: pointer; border: 2px solid transparent; }
.cat-btn.b-shop { background: #E1F5EE; color: #0F6E56; }
.cat-btn.b-life { background: #E6F1FB; color: #185FA5; }
.cat-btn.b-know { background: #FAEEDA; color: #854F0B; }
.cat-btn.b-none { background: var(--bg2); color: var(--text2); border: 1px solid var(--border); }
.cat-btn.sel { outline: 2px solid var(--teal-dark); outline-offset: 1px; }
.dots { display: inline-flex; gap: 3px; align-items: center; }
.dots span { width: 5px; height: 5px; background: var(--teal); border-radius: 50%; animation: bop .9s infinite; }
.dots span:nth-child(2) { animation-delay: .15s; }
.dots span:nth-child(3) { animation-delay: .3s; }
@keyframes bop { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-4px)} }
.btn-row { display: flex; gap: 7px; margin-top: 14px; }
.btn-cancel { flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; cursor: pointer; background: var(--bg2); color: var(--text2); font-family: inherit; }
.btn-cancel:hover { background: var(--border); }
.btn-save { flex: 2; padding: 8px; background: var(--teal); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; }
.btn-save:hover { background: var(--teal-dark); }
.btn-save:disabled { background: var(--bg2); color: var(--text3); cursor: default; }
</style>
</head>
<body>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">
      <div class="logo-box"><span></span><span></span><span></span><span></span></div>
      <div>
        <div class="logo-text">Bento</div>
        <div style="font-size:11px;color:#9a9a94;font-weight:400;margin-top:1px;">신수동오이</div>
      </div>
    </div>
    <div class="nav active" id="nav-home" onclick="goHome()"><i class="ti ti-home"></i> 홈</div>
    <div class="nav" id="nav-mypage"><i class="ti ti-user"></i> 마이페이지</div>
    <div class="sec-label">저장소</div>
    <div class="cat-nav" id="si-쇼핑" onclick="goStore('쇼핑')"><span class="dot" style="background:#1D9E75"></span>쇼핑<span class="cnt" id="c-쇼핑">0</span></div>
    <div class="cat-nav" id="si-라이프" onclick="goStore('라이프')"><span class="dot" style="background:#378ADD"></span>라이프<span class="cnt" id="c-라이프">0</span></div>
    <div class="cat-nav" id="si-지식·팁" onclick="goStore('지식·팁')"><span class="dot" style="background:#BA7517"></span>지식·팁<span class="cnt" id="c-지식·팁">0</span></div>

    <div class="cat-nav" id="si-미분류" onclick="goStore('미분류')">
      <span class="dot" style="background:#888780"></span>미분류
      <span class="cnt" id="c-미분류">0</span>
      <span class="none-badge" id="none-badge" style="display:none;"></span>
    </div>
    <div class="sidebar-footer">
      <div class="lbl">총 저장</div>
      <div class="num" id="total">0</div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div class="search-wrap">
        <i class="ti ti-search si"></i>
        <input type="text" placeholder="스마트 검색..." id="search-inp" oninput="doSearch()">
      </div>
      <button class="btn-add" onclick="openModal()"><i class="ti ti-plus"></i> 저장하기</button>
    </div>
    <div class="content" id="content"></div>
    <div class="statusbar">
      <div class="status-dot"></div>
      <span>AI 분류 엔진 연결됨</span>
      <span style="margin-left:auto;" id="status-lbl">홈</span>
    </div>
  </div>
</div>

<!-- 저장 모달 -->
<div class="modal-bg" id="modal" style="display:none;" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title"><i class="ti ti-sparkles"></i> 새 항목 저장</div>
    <div class="m-tabs">
      <div class="m-tab active" id="mt-url" onclick="switchTab('url')"><i class="ti ti-link"></i> URL</div>
      <div class="m-tab" id="mt-img" onclick="switchTab('img')"><i class="ti ti-photo"></i> 이미지</div>
      <div class="m-tab" id="mt-txt" onclick="switchTab('txt')"><i class="ti ti-pencil"></i> 텍스트</div>
    </div>
    <div id="p-url">
      <div class="inp-label">링크 붙여넣기</div>
      <input class="inp" type="text" id="url-inp" placeholder="https://..." oninput="onUrl()">
      <div id="url-result"></div>
    </div>
    <div id="p-img" style="display:none;">
      <div class="drop-zone" onclick="document.getElementById('file-inp').click()" ondragover="event.preventDefault()" ondrop="onDrop(event)">
        <input type="file" id="file-inp" accept="image/*" onchange="onFile(event)" style="display:none;">
        <i class="ti ti-cloud-upload dz-icon"></i>
        <p>클릭하거나 이미지를 드래그하세요<br><small style="color:#9a9a94;">스크린샷·캡처 이미지 지원</small></p>
      </div>
      <img id="img-prev" class="img-prev" style="display:none;" alt="미리보기">
      <div id="img-result"></div>
    </div>
    <div id="p-txt" style="display:none;">
      <div class="inp-label">메모 제목 (선택)</div>
      <input class="inp" type="text" id="txt-title" placeholder="제목..." style="margin-bottom:8px;">
      <div class="inp-label">내용</div>
      <textarea class="inp" id="txt-body" placeholder="저장할 내용을 입력하세요..." oninput="onTxt()"></textarea>
      <div id="txt-result"></div>
    </div>
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save" id="btn-save" onclick="saveItem()" disabled>AI 분류 후 저장</button>
    </div>
  </div>
</div>

<!-- 카테고리 수정 모달 -->
<div class="modal-bg" id="edit-modal" style="display:none;" onclick="if(event.target===this)closeEdit()">
  <div class="modal" style="width:340px;">
    <div class="modal-title"><i class="ti ti-edit"></i> 저장소 변경</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:12px;" id="edit-title-lbl"></div>
    <div class="inp-label">저장소 선택</div>
    <div class="cat-picker" style="gap:7px;" id="edit-picker">
      <button class="cat-btn b-shop" onclick="pickCat('쇼핑')">쇼핑</button>
      <button class="cat-btn b-life" onclick="pickCat('라이프')">라이프</button>
      <button class="cat-btn b-know" onclick="pickCat('지식·팁')">지식·팁</button>
      <button class="cat-btn b-none" onclick="pickCat('미분류')">미분류</button>
    </div>
    <div class="btn-row">
      <button class="btn-cancel" onclick="closeEdit()">취소</button>
      <button class="btn-save" onclick="confirmEdit()">변경 완료</button>
    </div>
  </div>
</div>

<script>
const CATS = ['쇼핑','라이프','지식·팁','미분류'];
const CAT_BADGE = {'쇼핑':'b-shop','라이프':'b-life','지식·팁':'b-know','미분류':'b-none'};
const CAT_EMOJI_DEF = {'쇼핑':'🛍️','라이프':'📱','지식·팁':'📚','미분류':'📦'};
const STORE_ICONS = {'쇼핑':'🛍️','라이프':'🌿','지식·팁':'📚','미분류':'📦'};
// 사이드바 카테고리명 업데이트


const DOMAIN_MAP = [
  {p:['nike.com','adidas.com','coupang.com','gmarket.co.kr','11st.co.kr','musinsa.com','zigzag.kr','29cm.co.kr','oliveyoung.co.kr','ssg.com','lotteon.com','ably.kr','wconcept.co.kr','amazon.com','ebay.com','shein.com','zara.com','uniqlo.com','hm.com','shop.naver.com','auction.co.kr'],c:'쇼핑'},
  {p:['youtube.com','youtu.be','netflix.com','tiktok.com','instagram.com','twitter.com','x.com','threads.net','facebook.com','naver.com','daum.net','band.us','map.kakao.com','map.naver.com','maps.google.com','booking.com','airbnb.com','yanolja.com','goodchoice.kr','myrealtrip.com','tripadvisor.com'],c:'라이프'},
  {p:['blog.naver.com','brunch.co.kr','tistory.com','medium.com','velog.io','github.com','stackoverflow.com','wikipedia.org','namu.wiki','coursera.org','udemy.com','inflearn.com','docs.','learn.','developer.'],c:'지식·팁'},
];

let items = [
  {id:1,type:'url',title:'나이키 에어맥스 97 화이트',category:'쇼핑',summary:'나이키 공식 홈페이지. 에어맥스 97 화이트 컬러웨이 ₩189,900',emoji:'👟',time:'2일 전',folder:null},
  {id:2,type:'url',title:'제주도 3박 4일 숙소 추천',category:'라이프',summary:'제주 서귀포 감성숙소 TOP 10, 가격대별 정리',emoji:'🌴',time:'3일 전',folder:'제주도 여행'},
  {id:3,type:'txt',title:'피부 루틴 메모',category:'지식·팁',summary:'세럼 → 에센스 → 크림 순 레이어링. 아침 선크림 필수',emoji:'📝',time:'5일 전',folder:null},
  {id:4,type:'url',title:'올리브영 비타민C 세럼 비교',category:'쇼핑',summary:'올리브영 인기 비타민C 세럼 브랜드별 성분·가격 비교',emoji:'✨',time:'1일 전',folder:'봄 뷰티 위시리스트'},
  {id:5,type:'url',title:'혼자 떠나는 제주 맛집 리스트',category:'라이프',summary:'제주 현지인 추천 맛집 20곳 정리',emoji:'🍽️',time:'4일 전',folder:'제주도 여행'},
];
let folders = [
  {id:'f1',store:'라이프',name:'제주도 여행'},
  {id:'f2',store:'쇼핑',name:'봄 뷰티 위시리스트'},
];

let view='home', currentStore=null, currentFolder=null, searchQ='';
let mTab='url', pending=null, editId=null, editCat=null, urlTimer=null;

function guessDomain(url) {
  const l=url.toLowerCase();
  for(const r of DOMAIN_MAP) if(r.p.some(p=>l.includes(p))) return r.c;
  return null;
}

function buildPrompt(url) {
  let domain='',path='';
  try{const u=new URL(url.startsWith('http')?url:'https://'+url);domain=u.hostname.replace('www.','');path=u.pathname;}catch(e){domain=url;}
  return `URL을 분석해 JSON만 반환하세요 (다른 텍스트, 마크다운 없이 순수 JSON만):
URL: ${url}
도메인: ${domain}
경로: ${path}

분류 기준:
- 쇼핑: 쇼핑몰·상품·의류·신발·뷰티·가전·구매 관련 (nike, coupang, musinsa, oliveyoung, 29cm, zigzag 등)
- 라이프: 맛집·여행·숙소·카페·SNS·유튜브·뉴스·지도·일상 콘텐츠
- 지식·팁: 블로그·아티클·공부·개발·레시피·튜토리얼·위키·정보성 글
- 미분류: 위 셋 어디도 해당 안 될 때만 (최대한 피할 것)

{"category":"쇼핑|라이프|지식·팁|미분류","title":"제목(한국어20자이내)","summary":"2문장요약(한국어)","emoji":"관련이모지1개"}`;
}

function buildImgPrompt() {
  return `이 이미지를 분석하고 JSON만 반환하세요 (다른 텍스트, 마크다운 없이 순수 JSON만).

이미지에서 다음을 확인하세요:
- 상품 이미지, 가격 정보, 쇼핑몰 UI → 쇼핑
- 음식 사진, 장소·지도, 여행 관련, SNS 게시물, 숙소 → 라이프
- 텍스트 위주 화면, 코드, 강의, 레시피, 공부 자료 → 지식·팁
- 위 셋 어디도 해당 없을 때만 → 미분류

제목은 이미지에서 보이는 핵심 내용으로 만들어주세요.
summary는 이미지에서 실제로 보이는 내용을 2문장으로 구체적으로 설명하세요.

{"category":"쇼핑|라이프|지식·팁|미분류","title":"제목(한국어20자이내)","summary":"이미지내용2문장(한국어)","emoji":"관련이모지1개"}`;
}

function buildTxtPrompt(title,body) {
  return `텍스트 메모를 분석해 JSON만 반환하세요 (다른 텍스트 없이):
제목: ${title||'없음'}
내용: ${body}

분류:
- 쇼핑: 상품·가격·위시리스트·구매 관련
- 라이프: 맛집·여행·일정·일상·카페
- 지식·팁: 공부·레시피·팁·노하우·정보·방법
- 미분류: 위 셋 어디도 해당 없을 때만

{"category":"쇼핑|라이프|지식·팁|미분류","title":"한국어20자이내","summary":"1-2문장요약","emoji":"이모지1개"}`;
}

function init() { render(); updateCounts(); }

function updateCounts() {
  CATS.forEach(cat => {
    document.getElementById('c-'+cat).textContent = items.filter(i=>i.category===cat).length;
  });
  document.getElementById('total').textContent = items.length;
  const n=items.filter(i=>i.category==='미분류').length;
  const b=document.getElementById('none-badge');
  b.style.display=n?'inline':'none';
  if(n) b.textContent=n;
}

function setSidebarActive(store) {
  document.querySelectorAll('.nav,.cat-nav').forEach(el=>el.classList.remove('active','active-cat'));
  if(!store){document.getElementById('nav-home').classList.add('active');return;}
  document.getElementById('si-'+store)?.classList.add('active-cat');
}

function goHome(){view='home';currentStore=null;currentFolder=null;setSidebarActive(null);document.getElementById('status-lbl').textContent='홈';render();}
function goStore(s){view='store';currentStore=s;currentFolder=null;setSidebarActive(s);document.getElementById('status-lbl').textContent=s;render();}
function goFolder(s,f){view='folder';currentStore=s;currentFolder=f;document.getElementById('status-lbl').textContent=s+' › '+f;render();}
function doSearch(){searchQ=document.getElementById('search-inp').value;render();}

function render() {
  const c=document.getElementById('content');
  c.innerHTML='';
  if(view==='home') renderHome(c);
  else if(view==='store') renderStore(c);
  else if(view==='folder') renderFolder(c);
}

function renderHome(c) {
  const grid=el('div','store-grid');
  CATS.forEach(s=>{
    const cnt=items.filter(i=>i.category===s).length;
    const card=el('div','store-card');
    card.innerHTML=`<div class="store-card-icon">${STORE_ICONS[s]}</div><div class="store-card-name">${s}</div><div class="store-card-cnt">아이템 ${cnt}개</div>`;
    card.onclick=()=>goStore(s);
    grid.appendChild(card);
  });
  c.appendChild(grid);

  const lbl=el('div','section-label');
  lbl.textContent='최근 저장';
  lbl.style.marginTop='4px';
  c.appendChild(lbl);

  let recent=[...items].reverse().slice(0,5);
  if(searchQ) recent=recent.filter(i=>matches(i,searchQ));
  if(recent.length) recent.forEach(i=>c.appendChild(makeCard(i)));
  else c.appendChild(makeEmpty('아직 저장된 항목이 없어요.\n링크·이미지·텍스트를 저장하면 AI가 자동 분류해요.'));
}

function renderStore(c) {
  c.appendChild(makeBreadcrumb([{label:'홈',fn:goHome},{label:currentStore}]));
  const storeFolders=folders.filter(f=>f.store===currentStore);

  const flbl=el('div','section-label');
  flbl.innerHTML=`<span>폴더</span><span style="font-size:11px;color:var(--text3);">${storeFolders.length}개</span>`;
  c.appendChild(flbl);

  const fg=el('div','folder-grid');
  storeFolders.forEach(f=>{
    const cnt=items.filter(i=>i.category===currentStore&&i.folder===f.name).length;
    const fc=el('div','folder-card');
    fc.innerHTML=`<i class="ti ti-folder"></i><div><div class="folder-name">${f.name}</div><div class="folder-cnt">아이템 ${cnt}개</div></div>`;
    fc.onclick=()=>goFolder(currentStore,f.name);
    fg.appendChild(fc);
  });
  const nf=el('div','folder-card folder-new');
  nf.innerHTML=`<i class="ti ti-folder-plus" style="font-size:17px;color:inherit;"></i><span>새 폴더 만들기</span>`;
  nf.onclick=createFolder;
  fg.appendChild(nf);
  c.appendChild(fg);

  let storeItems=items.filter(i=>i.category===currentStore&&!i.folder);
  if(searchQ) storeItems=storeItems.filter(i=>matches(i,searchQ));
  const ilbl=el('div','section-label');
  ilbl.innerHTML=`<span>미배정 항목</span><span style="font-size:11px;color:var(--text3);">${storeItems.length}개</span>`;
  c.appendChild(ilbl);
  if(storeItems.length) storeItems.slice().reverse().forEach(i=>c.appendChild(makeCard(i)));
  else c.appendChild(makeEmpty('폴더에 배정되지 않은 항목이 없어요.'));
}

function renderFolder(c) {
  c.appendChild(makeBreadcrumb([{label:'홈',fn:goHome},{label:currentStore,fn:()=>goStore(currentStore)},{label:currentFolder}]));
  let fi=items.filter(i=>i.category===currentStore&&i.folder===currentFolder);
  if(searchQ) fi=fi.filter(i=>matches(i,searchQ));
  const lbl=el('div','section-label');
  lbl.innerHTML=`<span>${currentFolder}</span><span style="font-size:11px;color:var(--text3);">${fi.length}개</span>`;
  c.appendChild(lbl);
  if(fi.length) fi.slice().reverse().forEach(i=>c.appendChild(makeCard(i)));
  else c.appendChild(makeEmpty('이 폴더에 저장된 항목이 없어요.'));
}

function makeCard(item) {
  const card=el('div','item-card');
  const bc=CAT_BADGE[item.category]||'b-none';
  const tc={'url':'링크','img':'이미지','txt':'메모'}[item.type]||item.type;
  card.innerHTML=`
    <div class="thumb">${item.thumb?`<img src="${item.thumb}" alt="">`:(item.emoji||'📄')}</div>
    <div class="item-info">
      <div class="item-title">${item.title}</div>
      <div class="item-meta">
        <span class="badge ${bc}">${item.category}</span>

        <span class="type-tag">${tc}</span>
        <span>${item.time}</span>
        <button class="edit-btn" onclick="openEdit(${item.id})">수정</button>
      </div>
      <div class="item-summary">${item.summary||''}</div>
    </div>`;
  return card;
}

function makeBreadcrumb(crumbs) {
  const bc=el('div','breadcrumb');
  bc.style.marginBottom='14px';
  crumbs.forEach((cr,i)=>{
    if(i>0){const sep=document.createElement('i');sep.className='ti ti-chevron-right';bc.appendChild(sep);}
    const s=document.createElement('span');
    if(cr.fn){s.className='link';s.textContent=cr.label;s.onclick=cr.fn;}
    else{s.className='cur';s.textContent=cr.label;}
    bc.appendChild(s);
  });
  return bc;
}

function makeEmpty(msg) {
  const d=el('div','empty');
  d.innerHTML=`<i class="ti ti-inbox"></i><p>${msg.replace('\n','<br>')}</p>`;
  return d;
}

function el(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e;}
function matches(i,q){const l=q.toLowerCase();return i.title.toLowerCase().includes(l)||(i.summary||'').toLowerCase().includes(l)||i.category.includes(l);}

function createFolder(){
  const name=prompt('폴더 이름을 입력하세요:');
  if(!name||!name.trim())return;
  folders.push({id:'f'+Date.now(),store:currentStore,name:name.trim()});
  render();
}

/* ── Modal ── */
function openModal(){
  pending=null;
  ['url-inp','txt-title','txt-body'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});
  ['url-result','img-result','txt-result'].forEach(id=>{const e=document.getElementById(id);if(e)e.innerHTML='';});
  document.getElementById('img-prev').style.display='none';
  document.getElementById('btn-save').disabled=true;
  document.getElementById('modal').style.display='flex';
  switchTab('url');
}
function closeModal(){document.getElementById('modal').style.display='none';pending=null;}
function switchTab(t){
  mTab=t;
  ['url','img','txt'].forEach(s=>{
    document.getElementById('p-'+s).style.display=s===t?'block':'none';
    document.getElementById('mt-'+s).className='m-tab'+(s===t?' active':'');
  });
  document.getElementById('btn-save').disabled=true;pending=null;
}

function showLoading(id,msg){document.getElementById(id).innerHTML=`<div class="classify-box"><div class="classify-lbl"><div class="dots"><span></span><span></span><span></span></div>&nbsp;${msg}</div></div>`;}

function showResult(id,r){
  const btns=CATS.map(c=>`<button class="cat-btn ${CAT_BADGE[c]}${c===r.category?' sel':''}" onclick="pickPending('${c}','${id}')">${c}</button>`).join('');
  document.getElementById(id).innerHTML=`
    <div class="classify-box">
      <div class="classify-lbl"><i class="ti ti-sparkles" style="font-size:12px;"></i>&nbsp;AI 자동 분류 완료 — 변경 가능</div>
      <div style="display:flex;align-items:center;gap:7px;margin-top:6px;">
        <span class="badge ${CAT_BADGE[r.category]||'b-none'}">${r.category}</span>
        <span style="font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${r.title}</span>
      </div>
      <div style="font-size:12px;color:var(--text2);margin-top:4px;line-height:1.5;">${r.summary}</div>
      <div style="margin-top:8px;">
        <div style="font-size:11px;color:var(--text3);margin-bottom:5px;">저장소 변경</div>
        <div class="cat-picker">${btns}</div>
      </div>
    </div>`;
}

function pickPending(cat,id){if(!pending)return;pending.category=cat;showResult(id,pending);}

function onUrl(){
  clearTimeout(urlTimer);
  const v=document.getElementById('url-inp').value.trim();
  if(!v){document.getElementById('url-result').innerHTML='';document.getElementById('btn-save').disabled=true;pending=null;return;}
  urlTimer=setTimeout(()=>classifyUrl(v),500);
}

async function classifyUrl(url){
  showLoading('url-result','AI 분류 중...');
  document.getElementById('btn-save').disabled=true;pending=null;
  const guess=guessDomain(url);
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:400,messages:[{role:'user',content:buildPrompt(url)}]})});
    const data=await res.json();
    const txt=data.content.filter(b=>b.type==='text').map(b=>b.text).join('');
    const r=JSON.parse(txt.replace(/```json|```/g,'').trim());
    if(!CATS.includes(r.category)&&guess)r.category=guess;
    r.url=url;pending=r;showResult('url-result',r);document.getElementById('btn-save').disabled=false;
  }catch(e){
    let domain='';try{domain=new URL(url.startsWith('http')?url:'https://'+url).hostname.replace('www.','');}catch(e2){domain=url;}
    const fb={category:guess||'미분류',emoji:'🔗',title:domain,summary:domain+' 페이지',url};
    pending=fb;showResult('url-result',fb);document.getElementById('btn-save').disabled=false;
  }
}

function onFile(e){const f=e.target.files[0];if(f)processImg(f);}
function onDrop(e){e.preventDefault();const f=e.dataTransfer.files[0];if(f&&f.type.startsWith('image/'))processImg(f);}
function processImg(file){
  const r=new FileReader();
  r.onload=ev=>{
    const src=ev.target.result;
    document.getElementById('img-prev').src=src;
    document.getElementById('img-prev').style.display='block';
    classifyImg(src,file.name);
  };
  r.readAsDataURL(file);
}

async function classifyImg(dataUrl,fname){
  showLoading('img-result','이미지 분석 중...');
  document.getElementById('btn-save').disabled=true;pending=null;
  const b64=dataUrl.split(',')[1],mt=dataUrl.split(';')[0].split(':')[1];
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      model:'claude-sonnet-4-20250514',
      max_tokens:400,
      messages:[{role:'user',content:[
        {type:'image',source:{type:'base64',media_type:mt,data:b64}},
        {type:'text',text:buildImgPrompt()}
      ]}]
    })});
    const data=await res.json();
    const txt=data.content.filter(b=>b.type==='text').map(b=>b.text).join('');
    const r=JSON.parse(txt.replace(/```json|```/g,'').trim());
    r.thumb=dataUrl;pending=r;showResult('img-result',r);document.getElementById('btn-save').disabled=false;
  }catch(e){
    const fb={category:'미분류',emoji:'🖼️',title:fname||'이미지',summary:'저장된 이미지',thumb:dataUrl};
    pending=fb;showResult('img-result',fb);document.getElementById('btn-save').disabled=false;
  }
}

function onTxt(){
  clearTimeout(urlTimer);
  const b=document.getElementById('txt-body').value.trim();
  if(!b){document.getElementById('txt-result').innerHTML='';document.getElementById('btn-save').disabled=true;pending=null;return;}
  urlTimer=setTimeout(classifyTxt,600);
}

async function classifyTxt(){
  const title=document.getElementById('txt-title').value.trim();
  const body=document.getElementById('txt-body').value.trim();
  showLoading('txt-result','AI 분류 중...');
  document.getElementById('btn-save').disabled=true;pending=null;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:400,messages:[{role:'user',content:buildTxtPrompt(title,body)}]})});
    const data=await res.json();
    const txt=data.content.filter(b=>b.type==='text').map(b=>b.text).join('');
    const r=JSON.parse(txt.replace(/```json|```/g,'').trim());
    pending=r;showResult('txt-result',r);document.getElementById('btn-save').disabled=false;
  }catch(e){
    const fb={category:'지식·팁',emoji:'📝',title:document.getElementById('txt-title').value||body.substring(0,20),summary:body.substring(0,60)};
    pending=fb;showResult('txt-result',fb);document.getElementById('btn-save').disabled=false;
  }
}

function saveItem(){
  if(!pending)return;
  const folder=(view==='folder'&&currentFolder&&currentStore===pending.category)?currentFolder:null;
  items.push({id:Date.now(),type:mTab,title:pending.title,url:pending.url||'',category:pending.category,summary:pending.summary,thumb:pending.thumb||null,emoji:pending.emoji||'📄',time:'방금 전',folder});
  updateCounts();render();closeModal();
}

function openEdit(id){
  const item=items.find(i=>i.id===id);if(!item)return;
  editId=id;editCat=item.category;
  document.getElementById('edit-title-lbl').textContent=item.title;
  document.querySelectorAll('#edit-picker .cat-btn').forEach(b=>b.classList.remove('sel'));
  document.querySelector(`#edit-picker .cat-btn[onclick="pickCat('${item.category}')"]`)?.classList.add('sel');
  document.getElementById('edit-modal').style.display='flex';
}
function closeEdit(){document.getElementById('edit-modal').style.display='none';editId=null;editCat=null;}
function pickCat(cat){editCat=cat;document.querySelectorAll('#edit-picker .cat-btn').forEach(b=>b.classList.remove('sel'));document.querySelector(`#edit-picker .cat-btn[onclick="pickCat('${cat}')"]`)?.classList.add('sel');}
function confirmEdit(){if(!editId||!editCat)return;const item=items.find(i=>i.id===editId);if(item)item.category=editCat;updateCounts();render();closeEdit();}

init();
</script>
</body>
</html>
